name: syncroom
description: SyncRoom - watch together from YouTube, local files, and screen share.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

flutter:
  uses-material-design: true

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.5.0
  web_socket_channel: ^3.0.3
  file_picker: ^12.2.0
  video_player: ^2.14.0
  youtube_player_iframe: ^6.0.2
  flutter_webrtc: ^1.6.1
  flutter_background: ^1.3.1
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#071020"
  adaptive_icon_foreground: "assets/app_icon.png"
