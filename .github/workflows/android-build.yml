name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Bootstrap Android and analyze
        run: bash ./scripts/bootstrap_android.sh

      - name: Build release APK
        env:
          API_BASE: ${{ vars.SYNCROOM_API_BASE }}
        run: |
          if [ -z "$API_BASE" ]; then
            echo "Repository variable SYNCROOM_API_BASE is not set" >&2
            exit 1
          fi

          flutter build apk --release \
            --dart-define=SYNCROOM_API_BASE="$API_BASE"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SyncRoom-Android-V1
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
