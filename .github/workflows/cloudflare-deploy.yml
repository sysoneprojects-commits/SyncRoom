name: Deploy Cloudflare API

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'server/**'
      - '.github/workflows/cloudflare-deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SYNCROOM_D1_DATABASE_ID: ${{ vars.SYNCROOM_D1_DATABASE_ID }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - name: Validate deploy variables
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN secret" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID secret" && exit 1)
          test -n "$SYNCROOM_D1_DATABASE_ID" || (echo "Missing SYNCROOM_D1_DATABASE_ID repository variable" && exit 1)
      - name: Build wrangler config
        run: |
          cat > wrangler.toml <<EOF2
          name = "syncroom-api"
          main = "src/index.ts"
          compatibility_date = "2026-09-01"

          [[durable_objects.bindings]]
          name = "ROOM_HUB"
          class_name = "RoomHub"

          [[migrations]]
          tag = "v1"
          new_sqlite_classes = ["RoomHub"]

          [[d1_databases]]
          binding = "DB"
          database_name = "syncroom-db"
          database_id = "$SYNCROOM_D1_DATABASE_ID"

          [vars]
          APP_ENV = "production"
          EOF2
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply syncroom-db --remote
      - name: Deploy Worker
        run: npx wrangler deploy
